id: fft-inspection
name: FFT Cadence + Trigger Gates
version: 1.0.0
contract_version: 1
description: Phân tích chuỗi số liệu để phân loại trạng thái chuyển động và phát trigger. Các trạng thái là suy luận, không xác nhận hành vi con người.
parameters:
  profile:
    label: Chế độ trigger
    type: enum
    default: inspection_sensor
    options: [inspection_sensor, research_lab]
  window_sec:
    label: Cửa sổ FFT
    type: float
    default: 0.8
    min: 0.5
    max: 5.0
    step: 0.1
    unit: s
  min_stable_duration_sec:
    label: Thời gian ổn định tối thiểu
    type: float
    default: 0.8
    min: 0.1
    max: 10.0
    step: 0.1
    unit: s
  stable_speed_threshold:
    label: Ngưỡng ổn định
    type: float
    default: 1.2
    min: 0.1
    max: 10.0
    step: 0.1
    unit: px/frame
  min_sharpness:
    label: Độ nét tối thiểu
    type: float
    default: 150.0
    min: 0
    max: 5000
    step: 10
  max_occlusion_ratio:
    label: Tỷ lệ vùng ít texture tối đa
    type: float
    default: 0.30
    min: 0
    max: 1
    step: 0.05
  max_angular_yaw_vel:
    label: Tốc độ dịch ngang tối đa (proxy)
    type: float
    default: 180.0
    min: 0
    max: 2000
    step: 10
    unit: px/s
  cooldown_sec:
    label: Thời gian nghỉ giữa trigger
    type: float
    default: 15.0
    min: 0
    max: 120
    step: 1
    unit: s
  spike_speed_threshold:
    label: Ngưỡng xung chuyển động
    type: float
    default: 12.0
    min: 1
    max: 100
    step: 1
    unit: px/frame
